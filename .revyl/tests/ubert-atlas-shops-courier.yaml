test:
    metadata:
        name: ubert-atlas-shops-courier
        platform: ios
        tags:
            - ethan
            - atlas
            - shops
            - courier
    build:
        name: Ubert
    blocks:
        - type: validation
          step_type: validation
          step_description: The Splash screen is visible. Background is solid black and the white "UBERT" wordmark is shown center-screen.
        - type: manual
          step_type: wait
          step_description: "3"
        - type: validation
          step_type: validation
          step_description: The Home screen is visible. Four top tabs are shown in order - "Rides", "Delivery", "Courier", "Shops" - with "Rides" active (bold and underlined). A bottom tab bar shows "Home", "Services", "Activity", "Account". A search bar with placeholder "Where to?" and a black "Now" pill are visible.
        - type: instructions
          step_type: instruction
          step_description: Tap the "Courier" top tab on the Home screen (the third tab, between "Delivery" and "Shops").
        - type: validation
          step_type: validation
          step_description: The Courier home view is visible inside the Home screen. The "Courier" top tab is now active (bold and underlined). A dark hero card at the top reads "Send anything, citywide" with subtitle "Same-day courier service. Pickup in 15 minutes or less." Two large action buttons are stacked below - a black "Send a package" card with subtitle "From you to a recipient, in one trip." and a light grey "Receive a package" card with subtitle "Have someone pick up and bring it to you." A "Recent courier orders" section lists rows like "Documents - 345 Spear St" with a fare like "$8.40", and "Small package - Mom" with a fare like "$11.30". A "How Courier works" section shows three numbered steps - "Set up your package", "Add sender and recipient", "Track in real time".
        - type: instructions
          step_type: instruction
          step_description: Tap the black "Send a package" button on the Courier home view (the first of the two large action cards, with the white send icon on the left).
        - type: validation
          step_type: validation
          step_description: The Package Details screen is visible. The header reads "Send a package" with a back chevron on the left. A heading "What are you sending?" is shown, followed by a list of package size cards - "Envelope", "Small", "Medium", and "Large" - each with a subtitle describing the size. A "Description" section with a multiline text input is shown below the size list. A black "Continue" button is pinned at the bottom of the screen.
        - type: instructions
          step_type: instruction
          step_description: Tap the back chevron (arrow-back icon) in the top-left of the "Send a package" header to return to the Home screen.
        - type: validation
          step_type: validation
          step_description: The Home screen is visible again with the Courier tab still active. The "Send anything, citywide" hero card, "Send a package" and "Receive a package" large buttons, and "Recent courier orders" section are all shown again.
        - type: instructions
          step_type: instruction
          step_description: Tap the "Shops" top tab on the Home screen (the fourth and rightmost tab).
        - type: validation
          step_type: validation
          step_description: The Shops home view is visible inside the Home screen. The "Shops" top tab is now active (bold and underlined). A search bar with placeholder "Search groceries, pharmacy and more" is shown near the top. A "Categories" section displays a horizontal chip row including "Grocery", "Convenience", "Alcohol", "Pets", "Home & DIY", "Pharmacy", and "Beauty". A "Stores near you" section lists store rows including "Whole Foods Market", "Trader Joe's", "7-Eleven", and "Walgreens", each with a thumbnail image, star rating, ETA in minutes, and delivery fee. A "See all stores" pill is shown at the bottom of the list.
        - type: instructions
          step_type: instruction
          step_description: Tap the "Whole Foods Market" store row in the "Stores near you" section.
        - type: validation
          step_type: validation
          step_description: The Store Detail screen is visible. A hero image fills the top with a circular white back button overlaid in the top-left. Below the hero the store name "Whole Foods Market" is shown in large bold text, followed by a meta row with a star rating ("4.8"), ETA ("25 min"), and delivery fee ("$2.99"). A light grey button labeled "View all aisles" with a list icon is shown directly below the meta row. A horizontal aisle strip is visible with chips including "Popular", "Produce", "Bakery", "Dairy & Eggs", and "Frozen". Below that, horizontal product sections are shown titled "Popular", "Produce", and "Bakery" with product cards displaying a price, name (such as "Organic Bananas", "Hass Avocado", "Sourdough Loaf"), and unit text.
        - type: instructions
          step_type: instruction
          step_description: Tap the light grey "View all aisles" button (the row with the list icon, just below the store name and meta row).
        - type: validation
          step_type: validation
          step_description: The Aisles screen is visible. The header reads "Whole Foods Market aisles" with a back chevron on the left. Helper text reads "Browse every aisle and find exactly what you need." A vertical list of aisle rows is shown including "Popular" (24 items), "Produce" (142 items), "Bakery" (38 items), "Dairy & Eggs" (56 items), "Frozen" (87 items), "Meat & Seafood" (64 items), "Pantry" (211 items), "Beverages" (96 items), "Snacks" (128 items), and "Household" (73 items). Each row has a circular icon on the left and a chevron-right on the right.
        - type: instructions
          step_type: instruction
          step_description: Tap the back chevron (arrow-back icon) in the top-left of the "Whole Foods Market aisles" header to return to the Store Detail screen.
        - type: validation
          step_type: validation
          step_description: The Store Detail screen is visible again with the "Whole Foods Market" hero, meta row (star rating, ETA, delivery fee), "View all aisles" button, and horizontal "Popular", "Produce", and "Bakery" product sections.
        - type: instructions
          step_type: instruction
          step_description: Tap the "Organic Bananas" product card in the horizontal "Popular" or "Produce" product row on the Store Detail screen.
        - type: validation
          step_type: validation
          step_description: The Product Detail screen is visible. A large hero image of the product fills the top with a circular white back button overlaid in the top-left. Below the hero the price "$0.69" is shown in large bold text, the unit "per lb" is shown directly under the price, and the product name "Organic Bananas" is shown below the unit. A "Quantity" row with a stepper (minus, "1", plus) is visible. An "IF OUT OF STOCK" label is shown above a grouped list of three radio options - "Shopper's pick" (Let your shopper choose a replacement.), "Contact me" (Reach out before substituting.), and "Refund" (Skip the item and refund me.) - with "Shopper's pick" selected by default. A black "Add to cart - $0.69" button is pinned at the bottom.
        - type: instructions
          step_type: instruction
          step_description: Tap the black "Add to cart - $0.69" button pinned at the bottom of the Product Detail screen.
        - type: validation
          step_type: validation
          step_description: The Store Detail screen is visible again. A new black sticky cart bar has appeared pinned at the bottom of the screen, showing a count pill with "1", the label "View cart", and the total "$0.69" on the right.
        - type: instructions
          step_type: instruction
          step_description: Tap the black "View cart" bar pinned at the bottom of the Store Detail screen.
        - type: validation
          step_type: validation
          step_description: The Shops Cart screen is visible. The header reads "Whole Foods Market" with a back chevron on the left. An "ITEMS" section label is shown above a single line item for "Organic Bananas" with unit text "per lb", price "$0.69", and a quantity stepper showing "1". An "ORDER SUMMARY" section follows with rows for "Subtotal" ($0.69), "Delivery fee" ($2.99), "Service fee" (around $0.03), a divider, and a "Total" row in bold. A black "Place order - $3.71" button (or similar total) is pinned at the bottom of the screen.
        - type: instructions
          step_type: instruction
          step_description: Tap the black "Place order" button pinned at the bottom of the Shops Cart screen.
        - type: validation
          step_type: validation
          step_description: An iOS system alert titled "Order placed" is visible over the Cart screen with the body text "Your shopper will start picking your items shortly." and a single "OK" action button.
        - type: instructions
          step_type: instruction
          step_description: Tap the "OK" button on the "Order placed" alert.
        - type: validation
          step_type: validation
          step_description: The Home screen is visible again. The four top tabs "Rides", "Delivery", "Courier", "Shops" are shown, the "Where to?" search bar and "Now" pill are visible, and the bottom tab bar shows "Home", "Services", "Activity", "Account".
