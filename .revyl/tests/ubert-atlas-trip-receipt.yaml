test:
    metadata:
        name: ubert-atlas-trip-receipt
        platform: ios
        tags:
            - ethan
            - atlas
            - trip-receipt
    build:
        name: Ubert
    blocks:
        - type: validation
          step_type: validation
          step_description: The Splash screen is visible. Background is solid black and the white "UBERT" wordmark is shown center-screen.
        - type: manual
          step_type: wait
          step_description: "3"
        - type: validation
          step_type: validation
          step_description: The Home screen is visible. There are two top tabs labeled "Rides" and "Delivery", a search bar with placeholder "Where to?", and a bottom tab bar showing "Home", "Services", "Activity", "Account".
        - type: instructions
          step_type: instruction
          step_description: Tap the "Where to?" search bar near the top of the Home screen.
        - type: validation
          step_type: validation
          step_description: The Search screen is visible. Header shows the current origin address with a green dot, and a destination input field with placeholder "Where to?" is focused. A "Recent" section below lists saved places including "Home" and "Work". A "Suggestions" section below it lists destinations such as "Central Park", "LaGuardia Airport", and "Times Square".
        - type: instructions
          step_type: instruction
          step_description: Tap the row labeled "Central Park" in the Suggestions list to pick it as the destination.
        - type: validation
          step_type: validation
          step_description: The Ride Selection screen is visible. The top half shows a map with a route polyline between two markers. The bottom sheet shows the origin and destination addresses, a "Select a ride" heading, a scrollable list of ride options (e.g. UberX, Comfort, UberXL, Black), a payment row, and a black "Confirm" CTA button at the bottom whose label includes the ride name and a dollar price.
        - type: instructions
          step_type: instruction
          step_description: Tap the black "Confirm" button at the bottom of the Ride Selection screen to book the currently-selected ride.
        - type: validation
          step_type: validation
          step_description: The Finding Driver screen is visible. The screen has a black background with a white "Finding your driver" heading, three pulsing dots, a status timeline with rows "Confirming your request", "Finding nearby drivers", "Driver matched! Confirming pickup", a bottom info row showing "Ride type" and "Estimated fare", and an outlined "Cancel" button at the bottom.
        - type: manual
          step_type: wait
          step_description: "6"
        - type: validation
          step_type: validation
          step_description: The Driver Matched screen is visible. A map fills the top portion of the screen showing an animated car marker approaching a pickup pin. The bottom card shows the driver's name, a star rating, the license plate, action buttons, and a black "Start Trip" button.
        - type: instructions
          step_type: instruction
          step_description: Tap the black "Start Trip" button at the bottom of the Driver Matched screen.
        - type: validation
          step_type: validation
          step_description: The Trip In Progress screen is visible. A map fills the top portion of the screen showing the car moving along a route polyline toward the destination. The bottom card shows a "Heading to your destination" heading with the remaining minutes and arrival time.
        - type: manual
          step_type: wait
          step_description: "14"
        - type: validation
          step_type: validation
          step_description: The Trip Complete screen is visible. The heading "You've arrived" is shown at the top, with a stats row showing "Distance", "Duration", and "Total". Below are a star-rating row, a "Compliments" section with chips like "Good conversation", "Expert driving", "Great music", "Clean vehicle", a tip section "Tip ...?" with options "$1", "$2", "$5", "Other", and a footer with a "View receipt" button next to a black "Done" button.
        - type: instructions
          step_type: instruction
          step_description: Tap the "View receipt" button in the footer of the Trip Complete screen.
        - type: validation
          step_type: validation
          step_description: The Trip receipt screen is visible. The header title reads "Trip receipt" with a back chevron and a mail icon on the right. The screen shows the total fare in large bold type at the top with a subtitle reading "Charged to Visa •••• 4242" and the trip duration. A "FARE BREAKDOWN" card lists rows "Base fare", "Distance", "Time", "Booking fee", "Taxes & surcharges", and a bold "Total" row with the same fare. Below are a "PAID WITH" card showing "Visa •••• 4242" with sub "Personal · default", a "DRIVER" card with the driver's name and car details, an outlined "Request fare adjustment" button, and a black "Done" button pinned at the bottom.
        - type: instructions
          step_type: instruction
          step_description: Tap the back chevron in the header of the Trip receipt screen to return to the Trip Complete screen.
        - type: validation
          step_type: validation
          step_description: The Trip Complete screen is visible again with the "You've arrived" heading, the stats row, the rating and compliments sections, and the footer "View receipt" and "Done" buttons.
