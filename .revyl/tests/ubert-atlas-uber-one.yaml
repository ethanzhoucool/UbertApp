    blocks:
        - type: validation
          step_type: validation
          step_description: The Splash screen is visible. Background is solid black and the white "UBERT" wordmark is shown center-screen.
        - type: manual
          step_type: wait
          step_description: "3"
        - type: validation
          step_type: validation
          step_description: The Home screen is visible. There are two top tabs labeled "Rides" and "Delivery", a search bar with placeholder "Where to?", and a bottom tab bar showing "Home", "Services", "Activity", "Account".
        - type: instructions
          step_type: instruction
          step_description: Tap the "Account" tab in the bottom tab bar on the Home screen.
        - type: validation
          step_type: validation
          step_description: The Account bottom sheet is visible. A profile header shows the avatar, the name "Ethan Zhou", a star rating "5.00", and an "Edit account" row. A menu lists rows "Help", "Wallet", "Activity", "Promotions", "Uber One", "Send a gift", "Saved places", "Settings", and "Sign Out".
        - type: instructions
          step_type: instruction
          step_description: Tap the "Uber One" row in the Account sheet menu.
        - type: validation
          step_type: validation
          step_description: The Uber One landing screen is visible. The screen has a dark (near-black) background. At the top is a close (×) button on the left, a sparkly gold "Uber One" brand wordmark (gold "One" with shimmer/sparkle accents), a large white heading about member savings, and a list of benefits with sparkly gold checkmarks. A "See all benefits" button is below them, and a sparkly gold "Try free for 1 month" CTA button is pinned at the bottom.
        - type: instructions
          step_type: instruction
          step_description: Tap the "See all benefits" button inside the Member benefits card on the Uber One landing screen.
        - type: validation
          step_type: validation
          step_description: The Uber One benefits screen is visible. The header title reads "Uber One benefits" with a back chevron. The screen shows three labeled sections "EATS" (with rows "$0 Delivery Fee on food", "5–10% off pickup orders", "Member Mondays"), "RIDES" (with rows "6% Uber Cash on airport rides", "Top-tier support"), and "GROCERY & RETAIL" (with rows "$0 Delivery Fee on groceries", "5% off eligible orders"), each row with a circular icon, a bold title, and descriptive sub-text.
        - type: instructions
          step_type: instruction
          step_description: Tap the back chevron in the header of the All member benefits screen to return to the Uber One landing screen.
        - type: validation
          step_type: validation
          step_description: The Uber One landing screen is visible again with the dark background, sparkly gold "Uber One" brand accents, member savings heading, gold checkmark benefits, and the sparkly gold "Try free for 1 month" CTA pinned at the bottom.
        - type: instructions
          step_type: instruction
          step_description: Tap the sparkly gold "Try free for 1 month" button pinned at the bottom of the Uber One landing screen.
        - type: validation
          step_type: validation
          step_description: The Confirm membership screen is visible. The header title reads "Confirm Uber One" with a back chevron. The screen shows a "CHOOSE A PLAN" section with two radio rows "Monthly" ($9.99/mo, selected by default) and "Annual" ($99.99/yr, with gold "Best value · Save 17%" meta text). Below is a "PAYMENT METHOD" section and a confirm subscription CTA pinned at the bottom.
        - type: instructions
          step_type: instruction
          step_description: Tap the "Annual" plan radio row in the CHOOSE A PLAN section on the Confirm membership screen.
        - type: validation
          step_type: validation
          step_description: The Confirm membership screen is still visible. The "Annual" plan row now shows a filled radio dot indicating it is selected, while the "Monthly" radio is empty. The info card text updates to mention "$99.99/yr" billing on the same date each year.
        - type: instructions
          step_type: instruction
          step_description: Tap the "Confirm subscription" button pinned at the bottom of the Confirm membership screen.
        - type: validation
          step_type: validation
          step_description: The Uber One success screen is visible. The screen has a dark background. A large sparkly gold circular check icon is centered, followed by a bold white heading "Welcome to Uber One", and a subtitle about active benefits. Below is a list of three benefits with gold icons. A sparkly gold "Get started" button is pinned at the bottom.
        - type: instructions
          step_type: instruction
          step_description: Tap the sparkly gold "Get started" button pinned at the bottom of the Uber One success screen.
        - type: validation
          step_type: validation
          step_description: The Home screen is visible again. The "Where to?" search bar, "Rides"/"Delivery" tabs, and bottom tab bar with "Home", "Services", "Activity", "Account" are all visible.
